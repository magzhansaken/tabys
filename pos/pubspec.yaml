name: shop_pos
description: Касса — Windows, Android, iOS одним кодом
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # локальная база: источник правды для кассира, сеть — только фоновый обмен
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  # токен устройства — в хранилище ОС (Credential Manager / Keystore / Keychain),
  # а не в файле рядом с программой
  flutter_secure_storage: ^9.2.2
  # проверка PIN офлайн: тот же bcrypt, что на сервере
  bcrypt: ^1.1.3
  crypto: ^3.0.3
  http: ^1.2.1
  web_socket_channel: ^2.4.5
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
